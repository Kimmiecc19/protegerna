# Reproducible defaults for the revised bio.tools analysis.
# Fetching and filtering default to Dimensions to match citations.source below.
# Maintained table columns use snake_case; GitHub push dates use last_push_at.
# Authentication is never stored here. Set GITHUB_TOKEN in the environment.
analysis_date: "2026-09-30"
random_seed: 42

inputs:
  # Relative paths are resolved from this file's folder (01_biotools_landscape/03_helpers/).
  github_cache: "../data/03a_data_tool_analysis/github_commit_cache_final.csv"
  filter_results_dir: "../results/02a_results_filter_biotools"
  mapped_operations: "../results/02bc_results_edam_annotation/all_edam_operations_mapped.tsv"

populations:
  registration_population: "all_records"
  full_suffix: "_all_records_quality_flags.tsv"
  candidate_suffix: "_candidate_tools.tsv"
  domains:
    genomic: "Genomics"
    transcriptomic: "Transcriptomics"
    proteomic: "Proteomics"
    multiomic: "Multiomics"

edam:
  source: "bio.tools function.operation"
  ontology: "EDAM"
  ontology_snapshot: "../results/02bc_results_edam_annotation/edam/EDAM.owl"
  hierarchy_relation: "rdfs:subClassOf"
  aggregation_depth: 1
  valid_status: "Valid EDAM operation"
  missing_label: "No valid EDAM operation annotation"
  top_groups: 12

candidate_filter:
  # First publication year kept without a citation threshold (see 02a_filter_biotools.R).
  no_threshold_from_year: 2020
  middle_from_year: 2015
  older_from_year: 2010
  middle_min_citations: 30
  older_min_citations: 50
  earliest_min_citations: 70

trend:
  # LOESS span for age-citation trend lines, fitted separately either side of
  # the candidate-filter boundary.
  span: 0.75
  min_loess_n: 50
  tail_quantile: 0.97

maintenance:
  recently_active_months: 18
  intermediate_activity_months: 36
  # Date commit-recency status is measured against. Set it to the date the
  # final GitHub retrieval finished (the manifest reports the retrieval range).
  # Leave blank to fall back to analysis_date.
  reference_date: "2026-09-30"

github:
  token_environment_variable: "GITHUB_TOKEN"
  refresh_by_default: false
  # Set to true once the final cache is complete so later runs never re-query
  # GitHub and every rerun reproduces the same status counts.
  freeze_cache: true
  engagement_components:
    - stars
    - forks
    - watchers
  include_open_issues_in_engagement: false
  missing_github_treatment: "Unknown"


# Primary citation comparisons use complete, conflict-free totals. Other records
# remain in population/registration summaries. Raw totals remain in audit output.
citations:
  source: "Dimensions"
