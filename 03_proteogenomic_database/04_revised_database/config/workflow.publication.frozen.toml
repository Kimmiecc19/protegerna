# Paths are relative to the project folder 03_proteogenomic_database/ (the default --project-dir).
# Event inputs point at 02_event_detection/ in this repository. Reference files (GTF database, genome,
# UniProt, GENCODE translations, cRAP) are not in the repository: place them in 03_proteogenomic_database/data/.
# The configuration exactly as run on the server is saved with the results (results_revised_database/).
# Frozen thesis-release configuration for the AnswerALS proteogenomic database.
#
# Release policy: publication
# - Primary FASTA only for SUPPA and Fusion; rMATS keeps all; no alternative-start 
#   or longest-ORF rescue tiers.
# - Reference-unique event/junction peptides required from reconstructed products.
# - GENCODE translation concordance is a mandatory zero-mismatch release gate.
# - Exact amino-acid deduplication occurs only during the authoritative merge.
# - Digestion rules match the quantMS/DIA-NN search: trypsin, 7-40 aa,
#   and up to 3 missed cleavages.
#
# Before the release run, verify that:
# 1. data/gencode.v46.pc_translations.fa is the official
#    GENCODE v46 protein-translation FASTA (this file is not currently present).
# 2. Peptide uniqueness is assessed against UniProt canonical PLUS the UniProt
#    "_additional" isoform FASTA (reference_proteome below), so annotated
#    isoforms are not counted as novel. Download
#    UP000005640_9606_additional.fasta.gz from the same UniProt release as the
#    canonical FASTA. The merged search database still adds canonical only
#    ([merge] reference_fasta); the reference-only quantMS control search should
#    use the same canonical FASTA.
# 3. The fusion and rMATS globs resolve to all six cohort batches, not test data;
#    SUPPA uses one events.ioe (annotation-derived, identical across batches) and
#    the PSI matrices of all six batches.

[workflow]
profile = "publication"
output_dir = "04_revised_database/results_revised_database"
resume = false

[common]
gtf_db = "data/Homo_sapiens_GRCh38_46.gtf.db"
genome = "data/Homo_sapiens_GRCh38_46_dna_primary_assembly.fa"
reference_proteome = [
  "data/UP000005640_9606.fasta.gz",
  "data/UP000005640_9606_additional.fasta.gz",
]
reference_peptide_cache = "04_revised_database/results_revised_database/reference_tryptic_peptides.cache"
annotation_release = "GENCODE_46"
organism = "Homo_sapiens"

[validate]
enabled = true
gencode_protein_fasta = "data/gencode.v46.pc_translations.fa"
out_tsv = "04_revised_database/results_revised_database/gencode_translation_concordance.tsv"
out_summary_json = "04_revised_database/results_revised_database/gencode_translation_concordance.json"
max_mismatch_rate = 0.0

[fusion]
enabled = true
fusioninspector = [
  "02_event_detection/02_results_rnafusion_final/rnafusion_analysis_batch[1-6]/fusioninspector/*.FusionInspector.fusions.abridged.tsv"
]
recursive_inputs = false

# Frozen transcript-selection and reconstruction rules.
max_transcripts_per_gene = 3
nmd_distance_threshold_nt = 55
early_stop_aa_cutoff = 30
min_retained_cds_nt = 30
max_breakpoint_snap_distance_nt = 25
min_split_reads_for_snapped_product = 2
exclude_incomplete_cds = true

# Frozen publication/DIA retention policy. quantms_conservative also enforces
# these values internally; they are repeated here to make the release explicit.
quantms_conservative = true
require_junction_peptide = true
require_unique_junction_peptide = true
exclude_frameshift_from_dia = true
exclude_truncated_from_dia = true
exclude_nmd_from_dia = true
include_donor_only_products = false

# Search-space-matched digestion rules.
digest_trypsin = true
max_missed_cleavages = 3
digested_min_peptide_length = 7
digested_max_peptide_length = 40

# Execution controls do not alter biological eligibility.
workers = 4
# transcript_model_cache = "04_revised_database/results_revised_database/fusion_transcript_models.pkl"
# (option removed 2026-10-12: the fusion program accepted it but never read or wrote the cache)

# Explicit producer outputs.
filtered_protein_fasta = "04_revised_database/results_revised_database/fusion.primary.fasta"
filtered_cds_fasta = "04_revised_database/results_revised_database/fusion.primary.cds.fasta"
biological_interpretation_tsv = "04_revised_database/results_revised_database/fusion.biological.tsv"
dia_database_metadata_tsv = "04_revised_database/results_revised_database/fusion.metadata.tsv"
out_sequence_sample_tsv = "04_revised_database/results_revised_database/fusion.sequence_samples.tsv"
digested_peptide_tsv = "04_revised_database/results_revised_database/fusion.peptides.tsv"

[rmats]
enabled = true

se_files = ["02_event_detection/03_results_rnasplice_final/rnasplice_analysis_batch[1-6]/rmats_post/SE.MATS.JC.txt"]
a3ss_files = ["02_event_detection/03_results_rnasplice_final/rnasplice_analysis_batch[1-6]/rmats_post/A3SS.MATS.JC.txt"]
a5ss_files = ["02_event_detection/03_results_rnasplice_final/rnasplice_analysis_batch[1-6]/rmats_post/A5SS.MATS.JC.txt"]
mxe_files = ["02_event_detection/03_results_rnasplice_final/rnasplice_analysis_batch[1-6]/rmats_post/MXE.MATS.JC.txt"]
ri_files = ["02_event_detection/03_results_rnasplice_final/rnasplice_analysis_batch[1-6]/rmats_post/RI.MATS.JC.txt"]

# Temporary workaround: allow every row with numeric rMATS statistics.
rmats_conservative_event_filter = true
include_failed_filter_proteins = true
max_fdr = 1.0
min_abs_inc_level_difference = 0.0
min_inclusion_junction_reads = 0
min_skipping_junction_reads = 0

pad_partial_codons = false
allow_alt_start = false
allow_longest_orf = false
short_junction_peptides = true
nmd_distance_threshold_nt = 55

# Same database rules as [suppa]. With include_failed_filter_proteins = true,
# reconstructable non-canonical rMATS proteins that fail these rules are still
# exported, with the failed rules recorded (passed_dia_filters = false).
quantms_conservative = true
require_unique_event_peptide = true

exclude_incomplete_cds = true
exclude_nmd_from_dia = true
exclude_start_loss_from_dia = true
exclude_frameshift_from_dia = false
exclude_premature_stop_from_dia = false

require_ri_orf_preserved = true
require_ri_read_evidence = true
min_ri_inclusion_reads = 1
require_ri_junction_peptide = true
exclude_ri_nmd_from_primary = false

max_missed_cleavages = 3
min_database_peptide_length = 7
max_database_peptide_length = 40

workers = 4
chunksize = 50000
sequence_cache_entries = 100000

out_prot_fa = "04_revised_database/results_revised_database/rmats.primary.fasta"
out_consequence_tsv = "04_revised_database/results_revised_database/rmats.consequences.tsv"
out_event_summary_tsv = "04_revised_database/results_revised_database/rmats.events.tsv"
out_junc_fa = "04_revised_database/results_revised_database/rmats.junction.fasta"

[suppa]
enabled = true

event_files = ["02_event_detection/03_results_rnasplice_final/rnasplice_analysis_batch1/suppa/generate_events/per_local_event/events.ioe"]
# No PSI filtering in this release: every annotated SUPPA event is considered.
# Omit psi_files to disable PSI filtering
# psi_files = []

# PSI is evidence for event inclusion only and never changes reconstruction.
# min_psi = 0.10
# min_psi_samples = 3
# keep_events_missing_psi = false


# Frozen reconstruction and primary-FASTA rules.
pad_partial_codons = false
allow_alt_start = false
allow_longest_orf = false
short_junction_peptides = true
nmd_distance_threshold_nt = 55
exclude_incomplete_cds = true
quantms_conservative = true
require_unique_event_peptide = true
exclude_nmd_from_dia = true
exclude_start_loss_from_dia = true
exclude_frameshift_from_dia = false
exclude_premature_stop_from_dia = false
require_ri_orf_preserved = true

# Search-space-matched digestion rules.
max_missed_cleavages = 3
min_database_peptide_length = 7
max_database_peptide_length = 40

workers = 4
sequence_cache_entries = 100000
out_prot_fa = "04_revised_database/results_revised_database/suppa.primary.fasta"
out_consequence_tsv = "04_revised_database/results_revised_database/suppa.consequences.tsv"
# out_psi_summary_tsv = "04_revised_database/results_revised_database/suppa.psi.tsv"
out_junc_fa = "04_revised_database/results_revised_database/suppa.junction.fasta"

[merge]
enabled = true
gencode_concordance_summary = "04_revised_database/results_revised_database/gencode_translation_concordance.json"
inputs = [
  "04_revised_database/results_revised_database/fusion.primary.fasta",
  "04_revised_database/results_revised_database/rmats.primary.fasta",
  "04_revised_database/results_revised_database/suppa.primary.fasta",
]
# Every producer FASTA must carry a run manifest that binds it to the validated reference.
require_producer_manifests = true
reference_fasta = ["data/UP000005640_9606.fasta.gz"]
contaminants_fasta = ["data/crap.fasta"]
record_types = ["protein"]
recursive = false

# Frozen authoritative merge rules.
include_rescue_tiers = false
min_protein_length = 6
min_peptide_length = 7
max_peptide_length = 40
max_missed_cleavages = 3
invalid_sequence_policy = "error"
id_prefix = "PGDB_U"
id_width = 7
max_header_values = 3
log_level = "INFO"

out_fasta = "04_revised_database/results_revised_database/proteogenomic_database.fasta"
out_metadata = "04_revised_database/results_revised_database/proteogenomic_metadata.tsv"
out_mapping = "04_revised_database/results_revised_database/proteogenomic_mapping.tsv"
out_peptide_evidence = "04_revised_database/results_revised_database/proteogenomic_peptides.tsv"
out_biological_interpretation = "04_revised_database/results_revised_database/proteogenomic_biological.tsv"
out_summary_tsv = "04_revised_database/results_revised_database/proteogenomic_summary.tsv"
out_summary_json = "04_revised_database/results_revised_database/proteogenomic_summary.json"

[qc]
enabled = true
fasta = ["04_revised_database/results_revised_database/proteogenomic_database.fasta"]
metadata = ["04_revised_database/results_revised_database/proteogenomic_metadata.tsv"]
reference_proteome = [
  "data/UP000005640_9606.fasta.gz",
  "data/UP000005640_9606_additional.fasta.gz",
]
outdir = "04_revised_database/results_revised_database/qc"
prefix = "proteogenomic_database"

# QC verifies the authoritative merge and does not deduplicate or rewrite it.
max_missed_cleavages = 3
min_peptide_length = 7
max_peptide_length = 40
min_protein_length = 6
exclude_no_eligible_peptide = false
write_filtered_fasta = false
strict_quantms = true

[report]
enabled = true
inputs = [
  "04_revised_database/results_revised_database/fusion.biological.tsv",
  "04_revised_database/results_revised_database/rmats.consequences.tsv",
  "04_revised_database/results_revised_database/suppa.consequences.tsv",
  "04_revised_database/results_revised_database/proteogenomic_biological.tsv",
]
out_tsv = "04_revised_database/results_revised_database/release_report.tsv"
out_json = "04_revised_database/results_revised_database/release_report.json"
