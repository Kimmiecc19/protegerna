# Frozen configuration for the proteogenomic database workflow.

[workflow]
profile = "publication"
output_dir = "results/pgdb_publication_rerun_v5"
resume = false

[common]
gtf_db = "data/gencode_v46.gtf.db"
genome = "data/Homo_sapiens_GRCh38_46_dna_primary_assembly.fa"
reference_proteome = "data/UP000005640_9606.fasta"
reference_peptide_cache = "results/pgdb_publication_rerun_v5/reference_tryptic_peptides.cache"
annotation_release = "GENCODE_46"
organism = "Homo_sapiens"

[validate]
enabled = true
gencode_protein_fasta = "data/gencode.v46.pc_translations.fa"
out_tsv = "results/pgdb_publication_rerun_v5/gencode_translation_concordance.tsv"
out_summary_json = "results/pgdb_publication_rerun_v5/gencode_translation_concordance.json"
max_mismatch_rate = 0.0

[fusion]
enabled = true
fusioninspector = [
  "/home/kcoetzer/nf/nf_results/rnafusion/rnafusion_analysis/rnafusion_analysis_batch[1-6]/fusioninspector/*.FusionInspector.fusions.abridged.tsv"
]

recursive_inputs = false

# Frozen transcript-selection and reconstruction rules.
max_transcripts_per_gene = 3
nmd_distance_threshold_nt = 55
early_stop_aa_cutoff = 30
min_retained_cds_nt = 30
max_breakpoint_snap_distance_nt = 25
min_split_reads_for_snapped_product = 2
exclude_incomplete_cds = true

# Frozen publication/DIA retention policy. quantms_conservative also enforces
# these values internally; they are repeated here to make the release explicit.
quantms_conservative = true
require_junction_peptide = true
require_unique_junction_peptide = true
exclude_frameshift_from_dia = true
exclude_truncated_from_dia = true
exclude_nmd_from_dia = true
include_donor_only_products = false

# Search-space-matched digestion rules.
digest_trypsin = true
max_missed_cleavages = 3
digested_min_peptide_length = 7
digested_max_peptide_length = 40

# Execution controls do not alter biological eligibility.
workers = 4
transcript_model_cache = "results/pgdb_publication_rerun_v5/fusion_transcript_models.pkl"

# Explicit producer outputs.
filtered_protein_fasta = "results/pgdb_publication_rerun_v5/fusion.primary.fasta"
filtered_cds_fasta = "results/pgdb_publication_rerun_v5/fusion.primary.cds.fasta"
biological_interpretation_tsv = "results/pgdb_publication_rerun_v5/fusion.biological.tsv"
dia_database_metadata_tsv = "results/pgdb_publication_rerun_v5/fusion.metadata.tsv"
out_sequence_sample_tsv = "results/pgdb_publication_rerun_v5/fusion.sequence_samples.tsv"
digested_peptide_tsv = "results/pgdb_publication_rerun_v5/fusion.peptides.tsv"

[rmats]
enabled = true

se_files = ["/home/kcoetzer/nf/nf_results/rnasplice/rnasplice_analysis/rnasplice_analysis_batch[1-6]/rmats_post/SE.MATS.JC.txt"]
a3ss_files = ["/home/kcoetzer/nf/nf_results/rnasplice/rnasplice_analysis/rnasplice_analysis_batch[1-6]/rmats_post/A3SS.MATS.JC.txt"]
a5ss_files = ["/home/kcoetzer/nf/nf_results/rnasplice/rnasplice_analysis/rnasplice_analysis_batch[1-6]/rmats_post/A5SS.MATS.JC.txt"]
mxe_files = ["/home/kcoetzer/nf/nf_results/rnasplice/rnasplice_analysis/rnasplice_analysis_batch[1-6]/rmats_post/MXE.MATS.JC.txt"]
ri_files = ["/home/kcoetzer/nf/nf_results/rnasplice/rnasplice_analysis/rnasplice_analysis_batch[1-6]/rmats_post/RI.MATS.JC.txt"]

# Differential-splicing significance is not an inclusion criterion: almost no
# events reached FDR < 0.05 (P ≈ 1 for >99% of events), reflecting low rMATS
# junction counts. Events instead require junction-read support for both
# isoforms summed across the cohort.

rmats_conservative_event_filter = true
include_failed_filter_proteins = true
max_fdr = 1.0
min_abs_inc_level_difference = 0.0
min_inclusion_junction_reads = 3
min_skipping_junction_reads = 3

pad_partial_codons = false
allow_alt_start = false
allow_longest_orf = false
short_junction_peptides = false
nmd_distance_threshold_nt = 55

quantms_conservative = false
require_unique_event_peptide = true

exclude_incomplete_cds = true
exclude_nmd_from_dia = true
exclude_start_loss_from_dia = true
exclude_frameshift_from_dia = false
exclude_premature_stop_from_dia = false

require_ri_orf_preserved = true
require_ri_read_evidence = true
min_ri_inclusion_reads = 3
require_ri_junction_peptide = true
exclude_ri_nmd_from_primary = false

max_missed_cleavages = 3
min_database_peptide_length = 7
max_database_peptide_length = 40

workers = 4
chunksize = 50000
sequence_cache_entries = 100000

out_prot_fa = "results/pgdb_publication_rerun_v5/rmats.primary.fasta"
out_consequence_tsv = "results/pgdb_publication_rerun_v5/rmats.consequences.tsv"
out_event_summary_tsv = "results/pgdb_publication_rerun_v5/rmats.events.tsv"

[suppa]
enabled = true

event_files = ["/home/kcoetzer/nf/nf_results/rnasplice/rnasplice_analysis/rnasplice_analysis_batch[1-6]/suppa/generate_events/per_local_event/events.ioe"]
psi_files = [
  "/home/kcoetzer/nf/nf_results/rnasplice/rnasplice_analysis/rnasplice_analysis_batch[1-6]/psi_per_local_event/suppa/suppa_local.psi"
]

# PSI is evidence for event inclusion only and never changes reconstruction.
min_psi = 0.10
min_psi_samples = 3
keep_events_missing_psi = false

# Frozen reconstruction and primary-FASTA rules.
pad_partial_codons = false
allow_alt_start = false
allow_longest_orf = false
short_junction_peptides = false
nmd_distance_threshold_nt = 55
exclude_incomplete_cds = true
quantms_conservative = true
require_unique_event_peptide = true
exclude_nmd_from_dia = true
exclude_start_loss_from_dia = true
exclude_frameshift_from_dia = false
exclude_premature_stop_from_dia = false
require_ri_orf_preserved = true

# Search-space-matched digestion rules.
max_missed_cleavages = 3
min_database_peptide_length = 7
max_database_peptide_length = 40

workers = 4
sequence_cache_entries = 100000
out_prot_fa = "results/pgdb_publication_rerun_v5/suppa.primary.fasta"
out_consequence_tsv = "results/pgdb_publication_rerun_v5/suppa.consequences.tsv"
out_psi_summary_tsv = "results/pgdb_publication_rerun_v5/suppa.psi.tsv"

[merge]
enabled = true
gencode_concordance_summary = "results/pgdb_publication_rerun_v5/gencode_translation_concordance.json"
inputs = [
  "results/pgdb_publication_rerun_v5/fusion.primary.fasta",
  "results/pgdb_publication_rerun_v5/rmats.primary.fasta",
  "results/pgdb_publication_rerun_v5/suppa.primary.fasta",
]
reference_fasta = ["data/UP000005640_9606.fasta"]
contaminants_fasta = ["data/crap.fasta"]
record_types = ["protein"]
recursive = false

# Frozen authoritative merge rules.
include_rescue_tiers = false
min_protein_length = 6
min_peptide_length = 7
max_peptide_length = 40
max_missed_cleavages = 3
invalid_sequence_policy = "error"
id_prefix = "PGDB_U"
id_width = 7
max_header_values = 3
log_level = "INFO"

out_fasta = "results/pgdb_publication_rerun_v5/proteogenomic_database.fasta"
out_metadata = "results/pgdb_publication_rerun_v5/proteogenomic_metadata.tsv"
out_mapping = "results/pgdb_publication_rerun_v5/proteogenomic_mapping.tsv"
out_peptide_evidence = "results/pgdb_publication_rerun_v5/proteogenomic_peptides.tsv"
out_biological_interpretation = "results/pgdb_publication_rerun_v5/proteogenomic_biological.tsv"
out_summary_tsv = "results/pgdb_publication_rerun_v5/proteogenomic_summary.tsv"
out_summary_json = "results/pgdb_publication_rerun_v5/proteogenomic_summary.json"

[qc]
enabled = true
fasta = ["results/pgdb_publication_rerun_v5/proteogenomic_database.fasta"]
metadata = ["results/pgdb_publication_rerun_v5/proteogenomic_metadata.tsv"]
reference_proteome = "data/UP000005640_9606.fasta"
outdir = "results/pgdb_publication_rerun_v5/qc"
prefix = "proteogenomic_database"

# QC verifies the authoritative merge and does not deduplicate or rewrite it.
max_missed_cleavages = 3
min_peptide_length = 7
max_peptide_length = 40
min_protein_length = 6
exclude_no_eligible_peptide = false
write_filtered_fasta = true
strict_quantms = true


[report]
enabled = true
inputs = [
  "results/pgdb_publication_rerun_v5/fusion.biological.tsv",
  "results/pgdb_publication_rerun_v5/rmats.consequences.tsv",
  "results/pgdb_publication_rerun_v5/suppa.consequences.tsv",
  "results/pgdb_publication_rerun_v5/proteogenomic_biological.tsv",
]
out_tsv = "results/pgdb_publication_rerun_v5/release_report.tsv"
out_json = "results/pgdb_publication_rerun_v5/release_report.json"
